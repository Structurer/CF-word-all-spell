<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背单词助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- 左侧列：上部输入区域 + 下部单词卡片 -->
        <div class="left-column">
            <!-- 上部：标题 + 操作按钮 + 输入框 -->
            <div class="top-section">
                <div class="top-bar">
                    <h1>背单词助手</h1>
                    <div class="top-actions">
                        <button class="btn" id="toggleTransBtn" disabled>隐藏释义</button>
                        <button class="btn reset" id="shuffleBtn" disabled>随机打乱</button>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" class="word-input" id="wordInput" placeholder="加载完成后可输入" disabled>
                    <span class="progress" id="progress">进度：0/0</span>
                </div>
            </div>
            <!-- 下部：主词库卡片滚动区（独立滚动） -->
            <div class="word-list-wrapper">
                <div class="word-list" id="wordList">
                    <div style="text-align: center; padding: 80px 20px; color: #4299e1; font-size: 20px; line-height: 2;">
                        ⏳ 正在加载单词数据...<br>
                        请稍候，加载完成后自动显示卡片
                    </div>
                </div>
            </div>
        </div>
        <!-- 右侧列：生词本（顶到页面最顶部，独立滚动，虚拟滚动） -->
        <div class="new-words-list" id="newWordsList">
            <div class="new-words-header">
                <span>📒 生词本</span>
                <span class="new-words-count" id="newWordsCount">0</span>
            </div>
            <div class="new-words-empty" id="newWordsEmpty">
                按 → 方向键加入生词
            </div>
        </div>
    </div>

    <script>
        // ============ 全局状态 ============
        let words = [];
        let currentIndex = 0;
        let shuffledWords = [];
        const leftScrollArea = document.getElementById('wordList');
        let isAutoScroll = false;
        let scrollTimeout = null;
        let enterClickCount = 0;
        let enterTimeout = null;
        let rafId = null;
        let globalHideTranslations = false;
        let autoScrollEndTimeout = null;
        let isSmoothScrolling = false;
        let isShuffleMode = false; // true=乱序模式，false=顺序模式
        let newWordsBook = []; // 生词本：存储被加入生词的单词对象列表

        // ============ 虚拟滚动配置与状态（左侧主词库） ============
        const ESTIMATED_CARD_HEIGHT = 160;
        const GAP = 18;
        const BUFFER = 5;
        let cardHeights = [];
        let cardTops = [];
        let totalHeight = 0;
        let lastRenderStart = -1;
        let lastRenderEnd = -1;
        let domReady = false;

        // ============ 虚拟滚动配置与状态（右侧生词本） ============
        const NW_ESTIMATED_HEIGHT = 90;  // 生词卡片预估高度
        const NW_GAP = 10;
        const NW_BUFFER = 5;
        let nwCardHeights = [];
        let nwCardTops = [];
        let nwTotalHeight = 0;
        let nwLastStart = -1;
        let nwLastEnd = -1;
        let nwDomReady = false;
        let nwRafId = null;
        let nwScrollArea = null;

        // ============ 加载词库 ============
        fetch('Vocabulary.json')
            .then(response => {
                if (!response.ok) throw new Error('文件访问失败');
                return response.json();
            })
            .then(data => {
                words = data;

                // 读取生词本缓存
                try {
                    const cachedBook = JSON.parse(localStorage.getItem('newWordsBook') || '[]');
                    if (Array.isArray(cachedBook)) newWordsBook = cachedBook;
                } catch (e) { newWordsBook = []; }

                // 读取缓存的模式和当前序号
                const cachedMode = localStorage.getItem('displayMode');
                isShuffleMode = cachedMode === 'shuffle';
                if (isShuffleMode) {
                    // 乱序模式下，需要保证刷新后同一顺序——从缓存恢复乱序结果（若存在且长度匹配），否则重新生成并缓存
                    const cachedShuffled = JSON.parse(localStorage.getItem('shuffledWordsMap') || 'null');
                    if (cachedShuffled && Array.isArray(cachedShuffled) && cachedShuffled.length === words.length && cachedShuffled.every(i => typeof i === 'number' && i >= 0 && i < words.length)) {
                        shuffledWords = cachedShuffled.map(i => words[i]);
                    } else {
                        const idxMap = words.map((_, i) => i).sort(() => Math.random() - 0.5);
                        shuffledWords = idxMap.map(i => words[i]);
                        localStorage.setItem('shuffledWordsMap', JSON.stringify(idxMap));
                    }
                } else {
                    shuffledWords = [...words];
                }

                const cachedIdx = parseInt(localStorage.getItem('currentIndex'), 10);
                if (!isNaN(cachedIdx) && cachedIdx >= 0 && cachedIdx < words.length) {
                    currentIndex = cachedIdx;
                }

                document.getElementById('progress').textContent = `进度：${currentIndex + 1}/${words.length}`;

                initVirtualScroll();
                initNewWordsVirtualScroll();
                bindEvents();
                enableAllControls();
                // 更新按钮文字匹配当前模式
                document.getElementById('shuffleBtn').textContent = isShuffleMode ? '顺序展示' : '随机打乱';
                activateCurrentWord(-1, false);
            })
            .catch(() => {
                document.getElementById('wordList').innerHTML = `
                    <div style="text-align: center; padding: 80px 20px; color: #e53e3e; font-size: 18px; line-height: 2.2;">
                        ❌ 单词数据加载失败！<br><br>
                        请检查：<br>
                        1. Vocabulary.json 文件是否在同文件夹<br>
                        2. 是否通过 HTTP 协议打开页面（本地 file:// 协议不支持跨文件读取）<br>
                    </div>
                `;
            });

        // ============ 虚拟滚动核心 ============

        // 初始化虚拟滚动结构
        function initVirtualScroll() {
            const wordList = document.getElementById('wordList');
            wordList.innerHTML = `
                <div class="virtual-spacer" id="virtualSpacer"></div>
                <div class="virtual-content" id="virtualContent"></div>
            `;
            cardHeights = shuffledWords.map(() => ESTIMATED_CARD_HEIGHT);
            computeTops();
            domReady = true;
            renderVisibleCards();
        }

        // 计算每张卡片顶部位置（前缀和）与总高度
        function computeTops() {
            cardTops = [];
            let top = 0;
            for (let i = 0; i < cardHeights.length; i++) {
                cardTops[i] = top;
                top += cardHeights[i] + GAP;
            }
            totalHeight = cardHeights.length > 0
                ? cardTops[cardHeights.length - 1] + cardHeights[cardHeights.length - 1] + GAP
                : 0;
            const spacer = document.getElementById('virtualSpacer');
            if (spacer) spacer.style.height = totalHeight + 'px';
        }

        // 二分查找：position 落在哪张卡片上（返回 top <= position 的最大索引）
        function findIndexAtPosition(position) {
            let lo = 0, hi = cardTops.length - 1;
            while (lo < hi) {
                const mid = (lo + hi + 1) >> 1;
                if (cardTops[mid] <= position) lo = mid;
                else hi = mid - 1;
            }
            return lo;
        }

        // 计算当前可视范围（含缓冲区）
        function computeVisibleRange() {
            const scrollTop = leftScrollArea.scrollTop;
            const viewportHeight = leftScrollArea.clientHeight;
            const startIndex = findIndexAtPosition(scrollTop);
            const endIndex = findIndexAtPosition(scrollTop + viewportHeight);
            return {
                start: Math.max(0, startIndex - BUFFER),
                end: Math.min(cardTops.length - 1, endIndex + BUFFER)
            };
        }

        // 创建单张卡片 DOM
        function createCard(wordObj, index) {
            const card = document.createElement('div');
            card.className = `word-card ${index === currentIndex ? 'active' : ''}`;
            card.dataset.index = index;

            let translationsHtml = '<div class="translations-container">';
            wordObj.translations.forEach(trans => {
                const meanings = trans.translation.split('；');
                meanings.forEach(mean => {
                    translationsHtml += `
                        <div class="translation-item">
                            <span class="meaning">${mean.trim()}</span>
                            <span class="pos-tag">${trans.type}</span>
                        </div>
                    `;
                });
            });
            translationsHtml += '</div>';

            let phrasesHtml = '';
            if (wordObj.phrases && wordObj.phrases.length > 0) {
                phrasesHtml = `
                    <div class="phrases-title">常用短语：</div>
                    <div class="phrase-list">
                        ${wordObj.phrases.map(phrase => `
                            <div class="phrase-item">
                                <span class="phrase-eng">${phrase.phrase}</span>
                                <span class="phrase-cn">${phrase.translation}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="word-header">
                    <div class="word">${wordObj.word}</div>
                </div>
                ${translationsHtml}
                ${phrasesHtml}
            `;

            const transItems = card.querySelectorAll('.translation-item');
            transItems.forEach(el => {
                if (globalHideTranslations) el.classList.add('hidden');
                el.addEventListener('click', () => el.classList.toggle('hidden'));
            });

            return card;
        }

        // 渲染当前可视范围内的卡片
        function renderVisibleCards() {
            if (!domReady) return;
            const range = computeVisibleRange();
            if (range.start === lastRenderStart && range.end === lastRenderEnd) return;
            lastRenderStart = range.start;
            lastRenderEnd = range.end;

            const content = document.getElementById('virtualContent');
            content.innerHTML = '';
            const fragment = document.createDocumentFragment();

            for (let i = range.start; i <= range.end; i++) {
                const card = createCard(shuffledWords[i], i);
                card.style.transform = `translateY(${cardTops[i]}px)`;
                fragment.appendChild(card);
            }
            content.appendChild(fragment);

            // 渲染后测量实际高度并修正预估高度
            requestAnimationFrame(measureAndCorrect);
        }

        // 测量已渲染卡片的真实高度，修正缓存并重新定位
        function measureAndCorrect() {
            const content = document.getElementById('virtualContent');
            if (!content) return;
            const cards = content.children;
            let changed = false;
            for (let i = 0; i < cards.length; i++) {
                const idx = parseInt(cards[i].dataset.index, 10);
                const actualHeight = cards[i].offsetHeight;
                if (Math.abs(actualHeight - cardHeights[idx]) > 1) {
                    cardHeights[idx] = actualHeight;
                    changed = true;
                }
            }
            if (changed) {
                computeTops();
                for (let i = 0; i < cards.length; i++) {
                    const idx = parseInt(cards[i].dataset.index, 10);
                    cards[i].style.transform = `translateY(${cardTops[idx]}px)`;
                }
                // 自动滚动期间，高度修正后重新对齐 scrollTop，保持当前单词在顶部
                // 注意：平滑滚动期间不强制设置，避免破坏动画；动画结束后由 smoothScrollTo 统一精准对齐
                if (isAutoScroll && !isSmoothScrolling) {
                    leftScrollArea.scrollTop = cardTops[currentIndex] || 0;
                }
            }
        }

        // ============ 生词本虚拟滚动 ============

        function initNewWordsVirtualScroll() {
            const listEl = document.getElementById('newWordsList');
            // 容器结构：header + 空提示（初始显示） + 滚动容器
            listEl.innerHTML = `
                <div class="new-words-header">
                    <span>📒 生词本</span>
                    <span class="new-words-count" id="newWordsCount">${newWordsBook.length}</span>
                </div>
                <div class="new-words-empty" id="newWordsEmpty" style="${newWordsBook.length > 0 ? 'display:none' : ''}">
                    按 → 方向键加入生词
                </div>
                <div class="new-words-scroll" id="newWordsScroll" style="${newWordsBook.length === 0 ? 'display:none' : ''}">
                    <div class="virtual-spacer" id="nwSpacer"></div>
                    <div class="virtual-content" id="nwContent"></div>
                </div>
            `;
            nwScrollArea = document.getElementById('newWordsScroll');
            nwCardHeights = newWordsBook.map(() => NW_ESTIMATED_HEIGHT);
            nwComputeTops();
            nwDomReady = true;
            nwRenderVisibleCards();

            if (nwScrollArea) {
                nwScrollArea.addEventListener('scroll', () => {
                    if (nwRafId) cancelAnimationFrame(nwRafId);
                    nwRafId = requestAnimationFrame(nwRenderVisibleCards);
                });
            }
        }

        function nwComputeTops() {
            nwCardTops = [];
            let top = 0;
            for (let i = 0; i < nwCardHeights.length; i++) {
                nwCardTops[i] = top;
                top += nwCardHeights[i] + NW_GAP;
            }
            nwTotalHeight = nwCardHeights.length > 0
                ? nwCardTops[nwCardHeights.length - 1] + nwCardHeights[nwCardHeights.length - 1] + NW_GAP
                : 0;
            const spacer = document.getElementById('nwSpacer');
            if (spacer) spacer.style.height = nwTotalHeight + 'px';
        }

        function nwFindIndexAtPosition(position) {
            if (nwCardTops.length === 0) return 0;
            let lo = 0, hi = nwCardTops.length - 1;
            while (lo < hi) {
                const mid = (lo + hi + 1) >> 1;
                if (nwCardTops[mid] <= position) lo = mid;
                else hi = mid - 1;
            }
            return lo;
        }

        function nwComputeVisibleRange() {
            if (!nwScrollArea) return { start: 0, end: 0 };
            const scrollTop = nwScrollArea.scrollTop;
            const viewportHeight = nwScrollArea.clientHeight;
            const startIndex = nwFindIndexAtPosition(scrollTop);
            const endIndex = nwFindIndexAtPosition(scrollTop + viewportHeight);
            return {
                start: Math.max(0, startIndex - NW_BUFFER),
                end: Math.min(nwCardTops.length - 1, endIndex + NW_BUFFER)
            };
        }

        function nwCreateCard(wordObj, index) {
            const card = document.createElement('div');
            card.className = 'new-word-card';
            card.dataset.index = index;

            let translationsHtml = '';
            wordObj.translations.forEach(trans => {
                const meanings = trans.translation.split('；');
                meanings.forEach(mean => {
                    translationsHtml += `
                        <div class="new-word-translation-item">
                            <span class="meaning">${mean.trim()}</span>
                            <span class="new-word-pos-tag">${trans.type}</span>
                        </div>
                    `;
                });
            });

            card.innerHTML = `
                <div class="new-word-row">
                    <div class="new-word">${wordObj.word}</div>
                    <button class="new-word-delete" title="删除该生词" aria-label="删除该生词">🗑</button>
                </div>
                ${translationsHtml}
            `;

            const transItems = card.querySelectorAll('.new-word-translation-item');
            transItems.forEach(el => {
                if (globalHideTranslations) el.classList.add('hidden');
                el.addEventListener('click', () => el.classList.toggle('hidden'));
            });

            const deleteBtn = card.querySelector('.new-word-delete');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeFromNewWordsBook(index);
                });
            }

            return card;
        }

        // 从生词本删除指定索引的单词（O(n) 重建缓存数组，但 DOM 仅重渲染可视区）
        function removeFromNewWordsBook(index) {
            if (index < 0 || index >= newWordsBook.length) return;
            newWordsBook.splice(index, 1);
            localStorage.setItem('newWordsBook', JSON.stringify(newWordsBook));

            // 重建虚拟滚动缓存
            nwCardHeights = newWordsBook.map(() => NW_ESTIMATED_HEIGHT);
            nwComputeTops();
            nwLastStart = -1;
            nwLastEnd = -1;
            nwRenderVisibleCards();

            // 如果当前滚动位置超出新总高度，回滚到底部
            if (nwScrollArea && nwScrollArea.scrollTop > nwTotalHeight) {
                nwScrollArea.scrollTop = Math.max(0, nwTotalHeight - nwScrollArea.clientHeight);
            }

            updateNewWordsUI();
        }

        function nwRenderVisibleCards() {
            if (!nwDomReady) return;
            if (newWordsBook.length === 0) return;
            const range = nwComputeVisibleRange();
            if (range.start === nwLastStart && range.end === nwLastEnd) return;
            nwLastStart = range.start;
            nwLastEnd = range.end;

            const content = document.getElementById('nwContent');
            if (!content) return;
            content.innerHTML = '';
            const fragment = document.createDocumentFragment();

            for (let i = range.start; i <= range.end; i++) {
                const card = nwCreateCard(newWordsBook[i], i);
                card.style.transform = `translateY(${nwCardTops[i]}px)`;
                fragment.appendChild(card);
            }
            content.appendChild(fragment);

            requestAnimationFrame(nwMeasureAndCorrect);
        }

        function nwMeasureAndCorrect() {
            const content = document.getElementById('nwContent');
            if (!content) return;
            const cards = content.children;
            let changed = false;
            for (let i = 0; i < cards.length; i++) {
                const idx = parseInt(cards[i].dataset.index, 10);
                const actualHeight = cards[i].offsetHeight;
                if (Math.abs(actualHeight - nwCardHeights[idx]) > 1) {
                    nwCardHeights[idx] = actualHeight;
                    changed = true;
                }
            }
            if (changed) {
                nwComputeTops();
                for (let i = 0; i < cards.length; i++) {
                    const idx = parseInt(cards[i].dataset.index, 10);
                    cards[i].style.transform = `translateY(${nwCardTops[idx]}px)`;
                }
            }
        }

        // 刷新生词本计数和空提示
        function updateNewWordsUI() {
            const countEl = document.getElementById('newWordsCount');
            const emptyEl = document.getElementById('newWordsEmpty');
            const scrollEl = document.getElementById('newWordsScroll');
            if (countEl) countEl.textContent = newWordsBook.length;
            if (emptyEl) emptyEl.style.display = newWordsBook.length > 0 ? 'none' : '';
            if (scrollEl) scrollEl.style.display = newWordsBook.length === 0 ? 'none' : '';
        }

        // ============ 交互逻辑 ============

        function enableAllControls() {
            document.getElementById('wordInput').disabled = false;
            document.getElementById('toggleTransBtn').disabled = false;
            document.getElementById('shuffleBtn').disabled = false;
            document.getElementById('wordInput').placeholder = '空格确认，Enter/↓下一个，↑上一个，→加入生词本';
            // 初始化时自动聚焦输入框
            document.getElementById('wordInput').focus();
        }

        function disableAllControls() {
            document.getElementById('wordInput').disabled = true;
        }

        // 更新 active class（只操作两个 DOM 节点，不遍历全部）
        function updateActiveClass(oldIdx, newIdx) {
            const content = document.getElementById('virtualContent');
            if (!content) return;
            if (oldIdx >= 0) {
                const oldCard = content.querySelector(`[data-index="${oldIdx}"]`);
                if (oldCard) oldCard.classList.remove('active');
            }
            if (newIdx >= 0) {
                const newCard = content.querySelector(`[data-index="${newIdx}"]`);
                if (newCard) newCard.classList.add('active');
            }
        }

        // 滚动到指定位置（instant=true 瞬间定位用于初始化/长距离，否则平滑滚动）
        function smoothScrollTo(top, instant = false) {
            isSmoothScrolling = !instant;
            isAutoScroll = true;

            if (instant) {
                leftScrollArea.scrollTop = top;
            } else {
                leftScrollArea.scrollTo({ top, behavior: 'smooth' });
            }

            clearTimeout(autoScrollEndTimeout);
            // instant 模式给 200ms 让 measureAndCorrect 稳定 cardTops；平滑模式 400ms
            autoScrollEndTimeout = setTimeout(() => {
                isSmoothScrolling = false;
                isAutoScroll = false;
                // 结束后精准对齐一次（应对高度修正导致的偏差）
                const finalTop = cardTops[currentIndex] || 0;
                if (Math.abs(leftScrollArea.scrollTop - finalTop) > 1) {
                    leftScrollArea.scrollTop = finalTop;
                }
            }, instant ? 200 : 400);
        }

        // 激活当前单词：滚动到顶部 + 渲染 + 标记 active（useSmooth=false 用于初始化瞬间定位）
        function activateCurrentWord(oldIdx = -1, useSmooth = true) {
            if (!domReady) return;

            // 选中单词滚动到窗口最上侧
            const top = cardTops[currentIndex] || 0;
            smoothScrollTo(top, !useSmooth);

            lastRenderStart = -1;
            lastRenderEnd = -1;
            renderVisibleCards();
            updateActiveClass(oldIdx, currentIndex);

            document.getElementById('wordInput').value = '';
            enterClickCount = 0;
        }

        function updateProgress() {
            document.getElementById('progress').textContent = `进度：${currentIndex + 1}/${shuffledWords.length}`;
            // 缓存当前单词序号，刷新页面后可恢复
            localStorage.setItem('currentIndex', currentIndex);
        }

        // 验证输入（拼写正确立即跳转，错误选中重输）
        function validateInput() {
            const inputEl = document.getElementById('wordInput');
            const inputValue = inputEl.value.trim().toLowerCase();
            const currentWord = shuffledWords[currentIndex].word.toLowerCase();

            if (inputValue === currentWord) {
                goToNextWord();
            } else {
                inputEl.select();
            }
        }

        function goToNextWord() {
            const oldIdx = currentIndex;
            currentIndex = currentIndex < shuffledWords.length - 1 ? currentIndex + 1 : 0;
            activateCurrentWord(oldIdx);
            updateProgress();
        }

        function goToPrevWord() {
            const oldIdx = currentIndex;
            currentIndex = currentIndex > 0 ? currentIndex - 1 : shuffledWords.length - 1;
            activateCurrentWord(oldIdx);
            updateProgress();
        }

        // 加入生词本（基于单词内容去重，避免重复添加）
        function addToNewWordsBook() {
            const currentWordObj = shuffledWords[currentIndex];
            if (!currentWordObj) return false;
            const exists = newWordsBook.some(w => w.word === currentWordObj.word);
            if (exists) return false;

            newWordsBook.push({ ...currentWordObj });
            localStorage.setItem('newWordsBook', JSON.stringify(newWordsBook));

            // 更新生词本虚拟滚动状态（仅追加 1 个元素，O(1) 操作，不重建整个列表）
            if (nwDomReady) {
                const newIdx = newWordsBook.length - 1;
                // 预估高度
                const prevTop = nwCardTops.length > 0
                    ? nwCardTops[nwCardTops.length - 1] + nwCardHeights[nwCardHeights.length - 1] + NW_GAP
                    : 0;
                nwCardHeights.push(NW_ESTIMATED_HEIGHT);
                nwCardTops.push(prevTop);
                nwTotalHeight = prevTop + NW_ESTIMATED_HEIGHT + NW_GAP;
                const spacer = document.getElementById('nwSpacer');
                if (spacer) spacer.style.height = nwTotalHeight + 'px';

                // 重置渲染范围让新卡片进入可视区
                nwLastStart = -1;
                nwLastEnd = -1;
                nwRenderVisibleCards();

                // 滚动到底部，让最新添加的生词可见
                if (nwScrollArea) {
                    nwScrollArea.scrollTop = nwTotalHeight;
                    nwRenderVisibleCards();
                    // 真实高度修正后再次精准对齐
                    requestAnimationFrame(() => {
                        nwRenderVisibleCards();
                        if (nwScrollArea) nwScrollArea.scrollTop = nwCardTops[nwCardTops.length - 1] || nwTotalHeight;
                    });
                }

                updateNewWordsUI();
            }

            return true;
        }

        // 查找滚动窗口顶部对应的单词索引（O(log n)）
        function findCenteredWordIndex() {
            return findIndexAtPosition(leftScrollArea.scrollTop);
        }

        // ============ 事件绑定 ============
        function bindEvents() {
            const inputEl = document.getElementById('wordInput');
            const toggleTransBtn = document.getElementById('toggleTransBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');

            // 统一按键处理（document 级别，输入框无论是否聚焦都能响应功能键）
            document.addEventListener('keydown', (e) => {
                if (inputEl.disabled) return;
                const isInputFocused = document.activeElement === inputEl;

                // 空格确认拼写（聚焦时取输入框内容验证；未聚焦时不处理，让正常输入）
                if ((e.key === ' ' || e.code === 'Space') && isInputFocused) {
                    e.preventDefault();
                    const inputValue = inputEl.value.trim();
                    if (inputValue) validateInput();
                    return;
                }

                // Enter / 下方向键：切换下一个单词
                if (e.key === 'Enter' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (!isInputFocused) inputEl.focus();
                    goToNextWord();
                    return;
                }

                // 右方向键：把当前单词加入生词本，并切换下一个单词
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (!isInputFocused) inputEl.focus();
                    addToNewWordsBook();
                    goToNextWord();
                    return;
                }

                // 上方向键：切换上一个单词
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (!isInputFocused) inputEl.focus();
                    goToPrevWord();
                    return;
                }

                // 未聚焦时按下字母/数字键：自动聚焦到输入框（让后续输入进入输入框）
                if (!isInputFocused && e.key.length === 1 && /[a-zA-Z0-9]/.test(e.key)) {
                    inputEl.focus();
                }
            });

            // 释义显示/隐藏切换（按钮文字随状态切换）
            toggleTransBtn.addEventListener('click', () => {
                globalHideTranslations = !globalHideTranslations;
                toggleTransBtn.textContent = globalHideTranslations ? '显示释义' : '隐藏释义';
                // 左侧主词库释义切换
                document.querySelectorAll('.translation-item').forEach(el => {
                    el.classList.toggle('hidden', globalHideTranslations);
                });
                // 右侧生词本释义切换
                document.querySelectorAll('.new-word-translation-item').forEach(el => {
                    el.classList.toggle('hidden', globalHideTranslations);
                });
            });

            // 切换展示模式：顺序 ↔ 乱序（保持 currentIndex 不变）
            shuffleBtn.addEventListener('click', () => {
                const oldIdx = currentIndex;
                isShuffleMode = !isShuffleMode;

                if (isShuffleMode) {
                    // 切换到乱序模式：生成新的乱序并缓存
                    const idxMap = words.map((_, i) => i).sort(() => Math.random() - 0.5);
                    shuffledWords = idxMap.map(i => words[i]);
                    localStorage.setItem('shuffledWordsMap', JSON.stringify(idxMap));
                    shuffleBtn.textContent = '顺序展示';
                } else {
                    // 切换到顺序模式：使用原始顺序
                    shuffledWords = [...words];
                    localStorage.removeItem('shuffledWordsMap');
                    shuffleBtn.textContent = '随机打乱';
                }
                localStorage.setItem('displayMode', isShuffleMode ? 'shuffle' : 'order');

                // 重置虚拟滚动，但保持 currentIndex
                cardHeights = shuffledWords.map(() => ESTIMATED_CARD_HEIGHT);
                computeTops();
                disableAllControls();

                // 瞬间定位到 currentIndex
                isSmoothScrolling = false;
                isAutoScroll = true;
                const targetTop = cardTops[currentIndex] || 0;
                leftScrollArea.scrollTop = targetTop;
                lastRenderStart = -1;
                lastRenderEnd = -1;
                renderVisibleCards();
                updateActiveClass(-1, currentIndex);
                document.getElementById('wordInput').value = '';
                enterClickCount = 0;
                clearTimeout(autoScrollEndTimeout);
                autoScrollEndTimeout = setTimeout(() => { isAutoScroll = false; }, 100);

                updateProgress();
                enableAllControls();
            });

            // 滚动事件：rAF 实时渲染可视卡片 + 防抖更新顶部单词索引 + 停止后吸顶对齐
            leftScrollArea.addEventListener('scroll', () => {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(renderVisibleCards);

                if (isAutoScroll) return;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const topIdx = findCenteredWordIndex();
                    if (topIdx !== currentIndex) {
                        const oldIdx = currentIndex;
                        currentIndex = topIdx;
                        updateActiveClass(oldIdx, currentIndex);
                        updateProgress();
                        document.getElementById('wordInput').value = '';
                        enterClickCount = 0;
                    }
                    // 吸顶：滚动停止后，把当前单词平滑对齐到窗口最上位置
                    const targetTop = cardTops[currentIndex] || 0;
                    if (Math.abs(leftScrollArea.scrollTop - targetTop) > 2) {
                        smoothScrollTo(targetTop);
                    }
                }, 600);
            });
        }
    </script>
</body>
