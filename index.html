<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词背诵助手（拼写验证版）</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- 左侧单词列表区 -->
        <div class="left-section" id="leftScrollArea">
            <h1>📚 单词背诵助手</h1>

            <div class="control-bar">
                <button class="btn" id="hideBtn" disabled>隐藏所有释义</button>
                <button class="btn" id="showBtn" disabled>显示所有释义</button>
                <button class="btn reset" id="shuffleBtn" disabled>随机打乱顺序</button>
                <span class="word-count" id="count">共 <span>0</span> 个单词</span>
            </div>

            <!-- 虚拟滚动容器（加载后由 JS 注入 spacer + content） -->
            <div class="word-list" id="wordList">
                <div style="text-align: center; padding: 80px 20px; color: #4299e1; font-size: 20px; line-height: 2;">
                    ⏳ 正在加载单词数据...<br>
                    请稍候，加载完成后自动显示卡片
                </div>
            </div>
        </div>

        <!-- 右侧输入区 -->
        <div class="right-section">
            <div class="input-container">
                <div class="input-title">✍️ 拼写单词</div>
                <input type="text" class="word-input" id="wordInput" placeholder="加载完成后可输入" disabled>
                <div class="feedback" id="feedback">📌 等待数据加载中...</div>
                <div class="progress" id="progress">进度：0/0</div>
                <button class="btn" id="nextBtn" disabled>下一个单词</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 全局状态 ============
        let words = [];
        let currentIndex = 0;
        let shuffledWords = [];
        const leftScrollArea = document.getElementById('leftScrollArea');
        let isAutoScroll = false;
        let scrollTimeout = null;
        let enterClickCount = 0;
        let enterTimeout = null;
        let rafId = null;
        let globalHideTranslations = false;

        // ============ 虚拟滚动配置与状态 ============
        const ESTIMATED_CARD_HEIGHT = 160; // 预估单卡高度（不含间距）
        const GAP = 18;                    // 卡片间距
        const BUFFER = 5;                  // 前后缓冲卡片数
        let cardHeights = [];              // 实际高度缓存
        let cardTops = [];                 // 每张卡片顶部位置（前缀和）
        let totalHeight = 0;               // 列表总高度
        let lastRenderStart = -1;          // 上次渲染范围（去重）
        let lastRenderEnd = -1;
        let domReady = false;              // 虚拟滚动结构是否就绪

        // ============ 加载词库 ============
        fetch('Vocabulary.json')
            .then(response => {
                if (!response.ok) throw new Error('文件访问失败');
                return response.json();
            })
            .then(data => {
                words = data;
                shuffledWords = [...words];
                document.querySelector('#count span').textContent = words.length;
                document.getElementById('progress').textContent = `进度：1/${words.length}`;

                initVirtualScroll();
                bindEvents();
                enableAllControls();
                activateCurrentWord();
            })
            .catch(() => {
                document.getElementById('wordList').innerHTML = `
                    <div style="text-align: center; padding: 80px 20px; color: #e53e3e; font-size: 18px; line-height: 2.2;">
                        ❌ 单词数据加载失败！<br><br>
                        请检查：<br>
                        1. Vocabulary.json 文件是否在同文件夹<br>
                        2. 是否通过 HTTP 协议打开页面（本地 file:// 协议不支持跨文件读取）<br>
                    </div>
                `;
                document.getElementById('feedback').textContent = '❌ 加载失败，请检查上述条件';
                document.getElementById('feedback').className = 'feedback error';
                document.getElementById('progress').textContent = '加载失败';
            });

        // ============ 虚拟滚动核心 ============

        // 初始化虚拟滚动结构
        function initVirtualScroll() {
            const wordList = document.getElementById('wordList');
            wordList.innerHTML = `
                <div class="virtual-spacer" id="virtualSpacer"></div>
                <div class="virtual-content" id="virtualContent"></div>
            `;
            cardHeights = shuffledWords.map(() => ESTIMATED_CARD_HEIGHT);
            computeTops();
            domReady = true;
            renderVisibleCards();
        }

        // 计算每张卡片顶部位置（前缀和）与总高度
        function computeTops() {
            cardTops = [];
            let top = 0;
            for (let i = 0; i < cardHeights.length; i++) {
                cardTops[i] = top;
                top += cardHeights[i] + GAP;
            }
            totalHeight = cardHeights.length > 0
                ? cardTops[cardHeights.length - 1] + cardHeights[cardHeights.length - 1] + GAP
                : 0;
            const spacer = document.getElementById('virtualSpacer');
            if (spacer) spacer.style.height = totalHeight + 'px';
        }

        // 二分查找：position 落在哪张卡片上（返回 top <= position 的最大索引）
        function findIndexAtPosition(position) {
            let lo = 0, hi = cardTops.length - 1;
            while (lo < hi) {
                const mid = (lo + hi + 1) >> 1;
                if (cardTops[mid] <= position) lo = mid;
                else hi = mid - 1;
            }
            return lo;
        }

        // 计算当前可视范围（含缓冲区）
        function computeVisibleRange() {
            const scrollTop = leftScrollArea.scrollTop;
            const viewportHeight = leftScrollArea.clientHeight;
            const startIndex = findIndexAtPosition(scrollTop);
            const endIndex = findIndexAtPosition(scrollTop + viewportHeight);
            return {
                start: Math.max(0, startIndex - BUFFER),
                end: Math.min(cardTops.length - 1, endIndex + BUFFER)
            };
        }

        // 创建单张卡片 DOM
        function createCard(wordObj, index) {
            const card = document.createElement('div');
            card.className = `word-card ${index === currentIndex ? 'active' : ''}`;
            card.dataset.index = index;

            let translationsHtml = '<div class="translations-container">';
            wordObj.translations.forEach(trans => {
                const meanings = trans.translation.split('；');
                meanings.forEach(mean => {
                    translationsHtml += `
                        <div class="translation-item">
                            <span class="meaning">${mean.trim()}</span>
                            <span class="pos-tag">${trans.type}</span>
                        </div>
                    `;
                });
            });
            translationsHtml += '</div>';

            let phrasesHtml = '';
            if (wordObj.phrases && wordObj.phrases.length > 0) {
                phrasesHtml = `
                    <div class="phrases-title">常用短语：</div>
                    <div class="phrase-list">
                        ${wordObj.phrases.map(phrase => `
                            <div class="phrase-item">
                                <span class="phrase-eng">${phrase.phrase}</span>
                                <span class="phrase-cn">${phrase.translation}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="word-header">
                    <div class="word">${wordObj.word}</div>
                </div>
                ${translationsHtml}
                ${phrasesHtml}
            `;

            const transItems = card.querySelectorAll('.translation-item');
            transItems.forEach(el => {
                if (globalHideTranslations) el.classList.add('hidden');
                el.addEventListener('click', () => el.classList.toggle('hidden'));
            });

            return card;
        }

        // 渲染当前可视范围内的卡片
        function renderVisibleCards() {
            if (!domReady) return;
            const range = computeVisibleRange();
            if (range.start === lastRenderStart && range.end === lastRenderEnd) return;
            lastRenderStart = range.start;
            lastRenderEnd = range.end;

            const content = document.getElementById('virtualContent');
            content.innerHTML = '';
            const fragment = document.createDocumentFragment();

            for (let i = range.start; i <= range.end; i++) {
                const card = createCard(shuffledWords[i], i);
                card.style.transform = `translateY(${cardTops[i]}px)`;
                fragment.appendChild(card);
            }
            content.appendChild(fragment);

            // 渲染后测量实际高度并修正预估高度
            requestAnimationFrame(measureAndCorrect);
        }

        // 测量已渲染卡片的真实高度，修正缓存并重新定位
        function measureAndCorrect() {
            const content = document.getElementById('virtualContent');
            if (!content) return;
            const cards = content.children;
            let changed = false;
            for (let i = 0; i < cards.length; i++) {
                const idx = parseInt(cards[i].dataset.index, 10);
                const actualHeight = cards[i].offsetHeight;
                if (Math.abs(actualHeight - cardHeights[idx]) > 1) {
                    cardHeights[idx] = actualHeight;
                    changed = true;
                }
            }
            if (changed) {
                computeTops();
                for (let i = 0; i < cards.length; i++) {
                    const idx = parseInt(cards[i].dataset.index, 10);
                    cards[i].style.transform = `translateY(${cardTops[idx]}px)`;
                }
            }
        }

        // ============ 交互逻辑 ============

        function enableAllControls() {
            document.getElementById('wordInput').disabled = false;
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('hideBtn').disabled = false;
            document.getElementById('showBtn').disabled = false;
            document.getElementById('shuffleBtn').disabled = false;
            document.getElementById('wordInput').placeholder = '输入单词按回车验证，双击回车跳过';
            document.getElementById('feedback').textContent = '';
        }

        function disableAllControls() {
            document.getElementById('wordInput').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('feedback').textContent = '📌 正在打乱...';
        }

        // 更新 active class（只操作两个 DOM 节点，不遍历全部）
        function updateActiveClass(oldIdx, newIdx) {
            const content = document.getElementById('virtualContent');
            if (!content) return;
            if (oldIdx >= 0) {
                const oldCard = content.querySelector(`[data-index="${oldIdx}"]`);
                if (oldCard) oldCard.classList.remove('active');
            }
            if (newIdx >= 0) {
                const newCard = content.querySelector(`[data-index="${newIdx}"]`);
                if (newCard) newCard.classList.add('active');
            }
        }

        // 激活当前单词：瞬间定位 + 渲染 + 标记 active
        function activateCurrentWord(oldIdx = -1) {
            if (!domReady) return;
            isAutoScroll = true;

            const top = cardTops[currentIndex] || 0;
            const cardH = cardHeights[currentIndex] || ESTIMATED_CARD_HEIGHT;
            const viewport = leftScrollArea.clientHeight;
            const target = Math.max(0, top - (viewport - cardH) / 2);

            leftScrollArea.scrollTop = target;
            lastRenderStart = -1;
            lastRenderEnd = -1;
            renderVisibleCards();
            updateActiveClass(oldIdx, currentIndex);

            document.getElementById('wordInput').value = '';
            document.getElementById('feedback').textContent = '';
            enterClickCount = 0;

            setTimeout(() => { isAutoScroll = false; }, 100);
        }

        function updateProgress() {
            document.getElementById('progress').textContent = `进度：${currentIndex + 1}/${shuffledWords.length}`;
        }

        // 验证输入（已删除 750ms 延迟，拼写正确立即跳转）
        function validateInput() {
            const inputEl = document.getElementById('wordInput');
            const feedbackEl = document.getElementById('feedback');
            const inputValue = inputEl.value.trim().toLowerCase();
            const currentWord = shuffledWords[currentIndex].word.toLowerCase();

            if (inputValue === currentWord) {
                feedbackEl.textContent = '✅ 拼写正确！';
                feedbackEl.className = 'feedback correct';
                goToNextWord();
            } else {
                feedbackEl.textContent = '❌ 拼写错误，再试试！';
                feedbackEl.className = 'feedback error';
                inputEl.select();
            }
        }

        function goToNextWord() {
            const oldIdx = currentIndex;
            if (currentIndex < shuffledWords.length - 1) {
                currentIndex++;
                activateCurrentWord(oldIdx);
                updateProgress();
            } else {
                document.getElementById('feedback').textContent = '🎉 所有单词背诵完成！';
                document.getElementById('feedback').className = 'feedback correct';
                setTimeout(() => {
                    currentIndex = 0;
                    activateCurrentWord(oldIdx);
                    updateProgress();
                }, 800);
            }
        }

        // 用计算找居中索引（O(log n)，不再遍历 DOM）
        function findCenteredWordIndex() {
            const scrollTop = leftScrollArea.scrollTop;
            const viewportCenter = scrollTop + leftScrollArea.clientHeight / 2;
            let lo = 0, hi = cardTops.length - 1;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (cardTops[mid] < viewportCenter) lo = mid + 1;
                else hi = mid;
            }
            const c1 = Math.max(0, lo - 1);
            const c2 = Math.min(cardTops.length - 1, lo);
            const center1 = cardTops[c1] + cardHeights[c1] / 2;
            const center2 = cardTops[c2] + cardHeights[c2] / 2;
            return Math.abs(center1 - viewportCenter) <= Math.abs(center2 - viewportCenter) ? c1 : c2;
        }

        // ============ 事件绑定 ============
        function bindEvents() {
            const inputEl = document.getElementById('wordInput');
            const nextBtn = document.getElementById('nextBtn');
            const hideBtn = document.getElementById('hideBtn');
            const showBtn = document.getElementById('showBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');

            // 回车事件（单击验证，双击跳过）
            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    enterClickCount++;

                    if (enterClickCount === 2) {
                        clearTimeout(enterTimeout);
                        document.getElementById('feedback').textContent = '⏭️ 跳过当前单词';
                        setTimeout(goToNextWord, 300);
                        enterClickCount = 0;
                    }

                    if (enterClickCount === 1) {
                        enterTimeout = setTimeout(() => {
                            const inputValue = inputEl.value.trim();
                            inputValue ? validateInput() : document.getElementById('feedback').textContent = '💡 双击回车可跳过';
                            enterClickCount = 0;
                        }, 250);
                    }
                }
            });

            nextBtn.addEventListener('click', goToNextWord);

            hideBtn.addEventListener('click', () => {
                globalHideTranslations = true;
                document.querySelectorAll('.translation-item').forEach(el => el.classList.add('hidden'));
            });
            showBtn.addEventListener('click', () => {
                globalHideTranslations = false;
                document.querySelectorAll('.translation-item').forEach(el => el.classList.remove('hidden'));
            });

            // 打乱单词（重置虚拟滚动状态）
            shuffleBtn.addEventListener('click', () => {
                isAutoScroll = true;
                shuffledWords = [...words].sort(() => Math.random() - 0.5);
                currentIndex = 0;
                cardHeights = shuffledWords.map(() => ESTIMATED_CARD_HEIGHT);
                lastRenderStart = -1;
                lastRenderEnd = -1;
                computeTops();
                disableAllControls();

                activateCurrentWord();
                updateProgress();
                enableAllControls();
            });

            // 滚动事件：rAF 实时渲染可视卡片 + 防抖更新居中索引
            leftScrollArea.addEventListener('scroll', () => {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(renderVisibleCards);

                if (isAutoScroll) return;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const centeredIdx = findCenteredWordIndex();
                    if (centeredIdx !== currentIndex) {
                        const oldIdx = currentIndex;
                        currentIndex = centeredIdx;
                        updateActiveClass(oldIdx, currentIndex);
                        updateProgress();
                        document.getElementById('wordInput').value = '';
                        document.getElementById('feedback').textContent = '';
                        enterClickCount = 0;
                    }
                }, 150);
            });
        }
    </script>
</body>
</html>
